spring:
  application:
    name: application-service

  datasource:
    url: jdbc:postgresql://localhost:5432/recruitment_application
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8082